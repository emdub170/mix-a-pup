<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Mix breeds, fill the Pupdex, train your pups, and send them to dog shows.">
<meta name="theme-color" content="#ECEEF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15172C" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mix-a-Pup">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mix-a-Pup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column; sticky status + tabs on top, action tray pinned to the bottom like a game HUD. */
:root{
  --bg:#ECEEF8; --surface:#FFFFFF; --surface-2:#E1E5F4; --ink:#23264A; --muted:#62668C; --line:#D3D8EB;
  --accent:#D3EE45; --accent-ink:#22264A; --select:#5357D4; --rare:#B44FCF; --new:#F2683A; --good:#2E9E6A;
  --pup-shadow:rgba(35,38,74,.13); --sil:brightness(0) opacity(.16); --alb:#F7DCE3; --alb-ink:#8E2F4C;
  --font-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15172C; --surface:#212443; --surface-2:#2A2E55; --ink:#ECEEFF; --muted:#A4A8CE; --line:#373B66;
  --accent:#D3EE45; --accent-ink:#1A1C33; --select:#9296FF; --rare:#E08BF2; --new:#FF8E62; --good:#5FD39C;
  --pup-shadow:rgba(0,0,0,.35); --sil:brightness(0) invert(1) opacity(.13); --alb:#5A2A3A; --alb-ink:#F7C9D6; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#15172C; --surface:#212443; --surface-2:#2A2E55; --ink:#ECEEFF; --muted:#A4A8CE; --line:#373B66;
  --accent:#D3EE45; --accent-ink:#1A1C33; --select:#9296FF; --rare:#E08BF2; --new:#FF8E62; --good:#5FD39C;
  --pup-shadow:rgba(0,0,0,.35); --sil:brightness(0) invert(1) opacity(.13); --alb:#5A2A3A; --alb-ink:#F7C9D6; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--select);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-bottom:170px}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.1;text-wrap:balance}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:grid;gap:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-size:28px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand h1 .ball{width:22px;height:22px;flex:none}
.ghost{background:none;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.status{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:5px 11px 5px 8px;font-weight:800;font-variant-numeric:tabular-nums}
.chip svg{width:18px;height:18px;flex:none}
.chip small{font-weight:700;color:var(--muted);font-size:12px}
.chip .adbtn{border:none;background:var(--surface-2);border-radius:999px;font-size:12px;font-weight:800;padding:2px 8px;margin-left:2px}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-radius:14px;padding:4px;gap:3px}
.tabs button{border:none;background:none;border-radius:10px;padding:8px 1px;font-weight:800;font-size:12.5px;color:var(--muted);position:relative}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tabs .dot{position:absolute;top:4px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--new)}

.sectionhead{display:flex;justify-content:space-between;align-items:baseline;margin-block:8px 10px;gap:12px}
.sectionhead h2{font-size:20px}
.sectionhead span{font-size:13px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pupcard{position:relative;background:var(--surface);border:2.5px solid transparent;border-radius:18px;padding:6px 6px 10px;text-align:center;display:flex;flex-direction:column;gap:2px;min-width:0}
.pupcard[aria-pressed="true"]{border-color:var(--select)}
.pupcard.away .art{opacity:.45}
.pupcard .art{aspect-ratio:1;max-width:100%;border-radius:14px;background:radial-gradient(circle at 50% 78%,var(--surface-2) 0 46%,transparent 47%)}
.pupcard .art svg{width:100%;height:100%;display:block}
.art,.mini{position:relative}
.pins{position:absolute;right:0;bottom:0;width:66%;display:flex;flex-direction:row-reverse}
.pin{width:40%;margin-left:-10%;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.3))}
.pin svg{width:100%;height:auto;display:block}
.rcase{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rc{background:var(--surface-2);border-radius:12px;padding:6px 4px;text-align:center;min-width:0}
.rc svg{width:72%;height:auto;display:block;margin:0 auto}
.rc b{display:block;font-size:11.5px}
.rc small{display:block;font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rkrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.rk{background:var(--surface);border-radius:14px;padding:8px 6px;text-align:center}
.rk svg{width:52%;height:auto;display:block;margin:0 auto}
.rk small{display:block;font-weight:800;font-size:12.5px;margin-top:2px}
.shopgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.item{background:var(--surface);border-radius:16px;padding:6px 6px 8px;display:flex;flex-direction:column;gap:3px;text-align:center;min-width:0}
.item .art{aspect-ratio:1;border-radius:12px;background:radial-gradient(circle at 50% 78%,var(--surface-2) 0 46%,transparent 47%)}
.item .art svg{width:100%;height:100%;display:block}
.item b{font-size:13px;line-height:1.2;text-wrap:balance}
.item span.k{font-size:11.5px;color:var(--muted);font-weight:700}
.item .btn{margin-top:auto;padding:8px 4px;font-size:13.5px;border-radius:11px}
.wprev{width:150px;height:150px;margin:0 auto}
.wprev svg{width:100%;height:100%;display:block}
.wchips{display:flex;flex-wrap:wrap;gap:6px}
.wchip{border:2px solid transparent;background:var(--surface-2);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13.5px}
.wchip[aria-pressed="true"]{border-color:var(--select);background:var(--surface)}
.ptabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ptabs button{border:2px solid transparent;background:var(--surface-2);border-radius:12px;padding:8px;font-weight:800}
.ptabs button[aria-selected="true"]{border-color:var(--select);background:var(--surface)}
.evtbl{display:grid;grid-template-columns:1.4fr .8fr .8fr 1fr;gap:6px 8px;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
.evtbl .h{color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.hist{display:grid;gap:8px}
.hrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface-2);border-radius:12px;padding:9px 11px}
.hrow i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.2);display:block}
.hrow b{font-size:14px;display:block}
.hrow small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.hrow .amt{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.pupcard .nm{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pupcard .br{font-size:11.5px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.selnum{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;background:var(--select);color:var(--bg);font-weight:800;font-size:13px;display:grid;place-items:center}
.badge{position:absolute;top:6px;right:6px;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 7px;font-variant-numeric:tabular-nums}
.b-rare{background:var(--rare);color:var(--bg)}
.b-des{background:var(--accent);color:var(--accent-ink)}
.b-mutt{background:var(--surface-2);color:var(--ink)}
.b-alb{background:var(--alb);color:var(--alb-ink)}
.b-train{background:var(--ink);color:var(--bg)}
.b-res{background:var(--new);color:#fff}
.ribs{display:flex;gap:6px;justify-content:center;min-height:15px;font-size:11.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.ribs span{display:inline-flex;align-items:center;gap:3px}
.ribs i{width:9px;height:9px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.18)}
.addcard{background:none;border:2.5px dashed var(--line);border-radius:18px;color:var(--muted);font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:150px;padding:10px}
.addcard .big{font-family:var(--font-display);font-size:30px;line-height:1;color:var(--ink)}
.addcard:disabled{opacity:.55;cursor:default}
.cost{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-variant-numeric:tabular-nums}
.cost svg{width:15px;height:15px}

.tray{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1.5px solid var(--line);
  padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.trayin{max-width:520px;margin:0 auto;display:grid;gap:10px}
.trayline{display:flex;align-items:center;gap:10px;min-height:40px}
.trayline .mini{width:44px;height:44px;flex:none}
.trayline .txt{min-width:0;flex:1}
.trayline .txt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trayline .txt span{font-size:13px;color:var(--muted);font-weight:700}
.iconbtn{border:none;background:var(--surface-2);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;flex:none;color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
.btnrow{display:flex;gap:8px}
.btn{flex:1;border:none;border-radius:14px;padding:12px 8px;font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-family:var(--font-display);font-size:18px;padding-block:9px}
.btn.link{background:none;flex:none;padding:4px 8px;color:var(--select);font-size:14px;text-decoration:underline;text-underline-offset:3px;justify-self:center}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:18px;height:18px}

.stats{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.stats .lbl{color:var(--muted)}
.stats .sb{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.stats .sb i{display:block;height:100%;background:var(--good);border-radius:99px}
.stats .w{color:var(--muted);font-weight:700;font-size:11.5px;margin-left:4px}
.statline{font-size:12.5px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}

.dexhead{background:var(--surface);border-radius:20px;padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:12px}
.dexhead .big{width:120px;height:120px;flex:none}
.dexhead .info{min-width:0;display:grid;gap:4px}
.reg{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.dexhead h3{font-size:22px}
.dexhead p{margin:0;font-size:14px;color:var(--muted)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--select);border-radius:99px}
.dexgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:16px}
.dexcell{background:var(--surface);border:2px solid transparent;border-radius:14px;padding:4px 4px 6px;text-align:center;min-width:0}
.dexcell[aria-pressed="true"]{border-color:var(--select)}
.dexcell svg{width:100%;aspect-ratio:1;display:block}
.dexcell .no{font-size:10px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.dexcell .nm{font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sil svg{filter:var(--sil)}

.shop{display:grid;gap:10px}
.offer{background:var(--surface);border-radius:18px;padding:10px;display:flex;align-items:center;gap:12px}
.offer .art{width:80px;height:80px;flex:none}
.offer .txt{flex:1;min-width:0;display:grid;gap:2px}
.offer .txt b{display:block;font-size:16px}
.offer .txt span{font-size:13px;color:var(--muted)}
.offer .btn{flex:none;padding-inline:14px}
.note{font-size:13px;color:var(--muted);margin:6px 0 14px}

.slot{background:var(--surface);border-radius:18px;padding:12px;display:flex;align-items:center;gap:12px}
.slot .art{width:72px;height:72px;flex:none}
.slot .txt{flex:1;min-width:0;display:grid;gap:6px}
.slot .btn{flex:none;padding-inline:14px}
.slot.empty{background:none;border:2.5px dashed var(--line);color:var(--muted);font-weight:700;font-size:14px;min-height:96px}
.evcard{background:var(--surface);border-radius:18px;padding:12px 14px;display:grid;gap:4px}
.evcard b{font-family:var(--font-display);font-size:18px}
.evcard p{margin:0;font-size:13.5px;color:var(--muted)}
.tierrow{display:grid;grid-template-columns:1.1fr 1fr 1fr .8fr;gap:6px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;padding:8px 2px;border-bottom:1px solid var(--line)}
.tierrow.h{color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.ribkey{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--muted)}
.ribkey span{display:inline-flex;align-items:center;gap:5px}
.ribkey i{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.2)}

.overlay{position:fixed;inset:0;z-index:20;background:rgba(15,16,34,.55);display:grid;place-items:end center;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.sheet{width:100%;max-width:440px;background:var(--surface);border-radius:26px;padding:18px;display:grid;gap:12px;max-height:88vh;overflow:auto}
.sheet h2{font-size:28px;text-align:center}
.sheet h3{font-size:16px}
.sheet .sub{text-align:center;color:var(--muted);font-weight:700;margin-top:-6px}
.sheet form{display:grid;gap:12px}
.sheethead{display:flex;align-items:center;gap:12px}
.sheethead .mini{width:64px;height:64px;flex:none}
.sheethead h2{text-align:left;font-size:24px}
.sheethead .sub{text-align:left;margin:0}
.tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 9px}
.t-new{background:var(--new);color:#fff}
.field{display:grid;gap:4px}
.field label,.lab{font-size:13px;font-weight:800;color:var(--muted)}
.field input{font:inherit;font-size:16px;font-weight:700;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.field textarea{font:12px ui-monospace,Consolas,monospace;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%;resize:vertical;word-break:break-all}
.field textarea:focus-visible{outline:3px solid var(--select);outline-offset:2px}
.setrow{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--surface-2);border-radius:14px;padding:10px 12px;font-weight:800}
.setrow small{display:block;font-weight:600;color:var(--muted);font-size:12.5px}
.setrow input{width:22px;height:22px;accent-color:var(--select);flex:none}
.setrow.off{opacity:.5}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg button{border:2px solid transparent;background:var(--surface-2);border-radius:12px;padding:8px 4px;font-weight:800;font-size:13.5px;display:grid;gap:1px}
.seg button small{font-weight:700;font-size:11px;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--select);background:var(--surface)}
.seg button:disabled{opacity:.45;cursor:default}
.choices{display:grid;gap:8px}
.choice{border:none;background:var(--surface-2);border-radius:14px;padding:12px 14px;text-align:left;display:grid;gap:2px}
.choice b{font-size:16px}
.choice span{font-size:13px;color:var(--muted);font-weight:700}
.summary{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;font-variant-numeric:tabular-nums;margin:0;background:var(--surface-2);border-radius:14px;padding:12px}
.summary dt{color:var(--muted);font-weight:700}
.summary dd{margin:0;font-weight:800;text-align:right}
.outlook{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:2px 9px;color:#fff}
.stage{position:relative;height:190px}
.stage .par{position:absolute;top:34px;width:118px}
.stage .pa{left:calc(50% - 146px);animation:inL .8s ease-in forwards}
.stage .pb{right:calc(50% - 146px);animation:inR .8s ease-in forwards}
.stage .poof{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:var(--accent);opacity:0;animation:poof .6s .65s ease-out forwards}
.stage .res{position:absolute;left:50%;top:0;width:180px;margin-left:-90px;transform:scale(0);animation:pop .5s .85s cubic-bezier(.3,1.6,.5,1) forwards}
.resinfo{display:grid;gap:12px;opacity:0;animation:fade .35s 1.15s forwards}
.showres{display:flex;align-items:center;justify-content:center;gap:4px;height:150px}
.showres .pupart{width:130px;height:130px}
.showres .ros{width:84px;height:100px;animation:pop2 .5s .2s cubic-bezier(.3,1.6,.5,1) both}
.flair{font-size:15px;font-weight:700;text-align:center;margin:0;text-wrap:balance}
.purse{font-family:var(--font-display);font-size:30px;text-align:center;line-height:1}
@keyframes pop2{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
@keyframes inL{to{transform:translateX(88px) scale(.55);opacity:0}}
@keyframes inR{to{transform:translateX(-88px) scale(.55);opacity:0}}
@keyframes poof{0%{opacity:.95;transform:scale(.2)}100%{opacity:0;transform:scale(5.5)}}
@keyframes pop{to{transform:scale(1)}}
@keyframes fade{to{opacity:1}}
.statlist{display:grid;grid-template-columns:1fr auto;gap:8px 16px;font-variant-numeric:tabular-nums;margin:0}
.statlist dt{color:var(--muted);font-weight:700}
.statlist dd{margin:0;font-weight:800;text-align:right}
.adbox{border:2.5px dashed var(--line);border-radius:18px;padding:28px 16px;text-align:center;display:grid;gap:6px}
.adbox .count{font-family:var(--font-display);font-size:44px;line-height:1}

.coach{position:fixed;inset:0;z-index:15;pointer-events:none}
.coach .ring{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:3px solid var(--select);animation:ring 1.2s ease-out infinite}
.coach .finger{position:absolute;width:40px;height:48px;animation:bob .8s ease-in-out infinite alternate}
.coach .finger svg{width:100%;height:100%;display:block}
.coach .bubble{position:absolute;width:max-content;max-width:min(260px,calc(100vw - 24px));background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px;pointer-events:auto;box-shadow:0 8px 24px var(--pup-shadow);display:grid;gap:8px}
.coach .bubble button{justify-self:end;border:none;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:4px 12px;font-weight:800;font-size:13px}
.coach .bubble button.skip{background:none;color:var(--bg);opacity:.7;text-decoration:underline;padding:0}
@keyframes bob{to{transform:translateY(8px)}}
@keyframes ring{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.7);opacity:0}}
@media (prefers-reduced-motion:reduce){.stage .par,.stage .poof{display:none}.stage .res,.showres .ros{transform:none;animation:none}.resinfo{opacity:1;animation:none}.coach .ring,.coach .finger{animation:none}}

.kbar{display:flex;gap:8px;margin-bottom:10px}
.goalbtn{flex:1;min-width:0;border:none;background:var(--surface);border-radius:14px;padding:8px 12px;display:flex;align-items:center;gap:10px;text-align:left;font-weight:800;font-size:14px}
.goalbtn small{display:block;color:var(--muted);font-weight:700;font-size:12px}
.pips{display:flex;gap:4px;margin-left:auto;flex:none}
.pips i{width:10px;height:10px;border-radius:50%;background:var(--surface-2);display:block}
.pips i.done{background:var(--good)}
.pips i.ready{background:var(--new)}
.sortbtn{flex:none;border:none;background:var(--surface);border-radius:14px;padding:8px 12px;font-weight:700;font-size:12px;color:var(--muted);text-align:left}
.sortbtn b{display:block;color:var(--ink);font-size:14px;font-weight:800}
.goal{background:var(--surface-2);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center}
.goal b{font-size:15px}
.goal .cnt{font-size:12px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.goal .bar{grid-column:1;background:var(--surface)}
.goal .btn{flex:none;grid-column:2;grid-row:1 / span 2;padding:8px 12px;font-size:14px;font-family:var(--font-body)}
.toast button{border:none;background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:3px 10px;font-weight:800;font-size:13px;margin-left:10px}
.blink{animation:blink 4.6s infinite}
.dexcell .blink{animation:none}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
.pupcard[aria-pressed="true"] .wag,.stage .res .wag,.showres .wag,.wprev .wag{animation:wag .32s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-7deg)}to{transform:rotate(9deg)}}
.pupcard[aria-pressed="true"] .art svg{animation:hop .35s ease-out}
@keyframes hop{40%{transform:translateY(-7%)}}
.confetti{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.blink,.wag,.pupcard[aria-pressed="true"] .art svg{animation:none!important}.confetti{display:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:30;
  background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;border-radius:14px;padding:10px 14px;max-width:min(420px,calc(100% - 32px));text-align:center;box-shadow:0 6px 20px var(--pup-shadow)}

function breedBase(id){if(BASE[id])return BASE[id].s;const ps=DES[id].p.map(breedBase);return ps[0].map((v,i)=>Math.round((v+ps[1][i])/2))}
function rollStats(arr,spread){const o={};STATS.forEach((k,i)=>o[k]=Math.round(clamp(arr[i]+(Math.random()*2-1)*spread,5,99)));return o}
function inheritStats(a,b,kind){const o={};STATS.forEach(k=>o[k]=Math.round(clamp((a.stats[k]+b.stats[k])/2+gauss()*6,5,99)));
  if(kind==='rare')o.looks=Math.min(99,o.looks+6);if(kind==='mutt')o.heart=Math.min(99,o.heart+2);return o}
const avgStat=p=>STATS.reduce((s,k)=>s+p.stats[k],0)/4;
function statBars(st,w){return `<div class="stats">${STATS.filter(k=>!w||w[k]).map(k=>`<span class="lbl">${SL[k]}${w?`<span class="w">${Math.round(w[k]*100)}%</span>`:''}</span><span class="sb"><i style="width:${st[k]}%"></i></span><span>${st[k]}</span>`).join('')}</div>`}
const statLine=st=>STATS.map(k=>`${SL[k]} ${st[k]}`).join(' · ');

/* ---------- Pups ---------- */
function freshName(s){const used=new Set(s.pups.map(p=>p.name));const pool=NAMES.filter(n=>!used.has(n));return rnd(pool.length?pool:NAMES)}
function makePup(kind,breed,traits,extra){return Object.assign({kind,breed,traits,trainUntil:0,trainings:0,ribbons:{},show:null},extra||{})}
const makeBase=b=>makePup('base',b,T({...BASE[b].t,tongue:Math.random()<.25}),{label:BASE[b].name,stats:rollStats(BASE[b].s,12)});
const makeRare=(b,i)=>makePup('rare',b,T({...BASE[b].t,...RARE[b][i].mod,tongue:Math.random()<.3}),{label:RARE[b][i].name,coat:i});
const makeDes=d=>makePup('designer',d,T({...DES[d].t,tongue:Math.random()<.3}),{label:DES[d].name});
function preOf(p){return p.kind==='mutt'?p.pre:BASE[p.breed]?BASE[p.breed].pre:DES[p.breed].name.slice(0,4)}
function sufOf(p){return p.kind==='mutt'?p.suf:BASE[p.breed]?BASE[p.breed].suf:DES[p.breed].name.slice(-4).toLowerCase()}
function makeMutt(a,b){
  const ta=a.traits,tb=b.traits,t={},pick=k=>Math.random()<.5?ta[k]:tb[k];
  ['pattern','ears','coat','snout','legs','tail','eye','c2','c3','saddle','merle'].forEach(k=>t[k]=pick(k));
  t.c1=Math.random()<.55?mix(ta.c1,tb.c1,.3+Math.random()*.4):pick('c1');
  t.size=clamp((ta.size+tb.size)/2+(Math.random()-.5)*.1,.66,1.08);
  if(Math.random()<.22){const m=Math.random();if(m<.35)t.pattern='patch';else if(m<.6)t.eye='blue';else if(m<.8)t.coat=t.coat==='smooth'?'fluffy':'smooth';else t.c1=mix(t.c1,'#8A5A3C',.4)}
  t.tongue=Math.random()<.4; t.bandana=Math.random()<.4?rnd(BANDANAS):null;
  const pre=preOf(a),suf=sufOf(b),word=(pre+suf).replace(/(.)\1\1/g,'$1$1');
  return makePup('mutt',null,T(t),{label:word.charAt(0).toUpperCase()+word.slice(1).toLowerCase(),pre,suf,baseValue:12+Math.floor(Math.random()*19)});
}
/* Shelter mutts: random stats with a ceiling, so mixing stays the path to champions. */
function shelterMutt(){const keys=Object.keys(BASE);let a=rnd(keys),b=rnd(keys);while(b===a)b=rnd(keys);const m=makeMutt(makeBase(a),makeBase(b));
  m.stats={};STATS.forEach(k=>m.stats[k]=20+Math.floor(Math.random()*41));return m}
function dexKey(p){return p.kind==='base'?'b:'+p.breed:p.kind==='designer'?'d:'+p.breed:p.kind==='rare'?'r:'+p.breed+':'+(p.coat||0):null}
const ribTotal=p=>Object.values(p.ribbons||{}).reduce((a,b)=>a+b,0);
function valueOf(p){const b=p.kind==='base'?10:p.kind==='designer'?(DES[p.breed].value||35):p.kind==='rare'?55:p.baseValue;
  let wins=0;for(const k in p.ribbons)if(+k<=4)wins+=p.ribbons[k];return Math.round(b*(.6+avgStat(p)/80))+3*wins+(p.albino?20:0)}
function kindTag(p){return p.kind==='rare'?'Rare coat':p.kind==='designer'?(DES[p.breed].tier?'Secret cross':'Designer'):p.kind==='mutt'?'Mutt':'Purebred'}
function addPup(s,p,how){p.id=s.nextId++;p.name=freshName(s);p.seed=p.seed||Math.floor(Math.random()*1e9);p.date=Date.now();p.dateType=how||'birthday';s.pups.push(p);
  const k=dexKey(p);let isNew=false;if(k&&!s.dex[k]){s.dex[k]=Date.now();isNew=true}if(p.kind==='mutt')s.mutts++;
  if(p.albino){s.albinos=(s.albinos||0)+1;if(p.kind==='base'&&!s.dex['a:'+p.breed]){s.dex['a:'+p.breed]=Date.now();isNew=true}}return isNew}
function mixResult(a,b){
  let p;
  if(a.kind==='mutt'||b.kind==='mutt') p=makeMutt(a,b);
  else if(a.breed===b.breed){
    if(BASE[a.breed]){const hit=Math.random()<rareChance(a,b);p=hit?makeRare(a.breed,pickCoat(a,b)):makeBase(a.breed);state.pity=state.pity||{};state.pity[a.breed]=hit?0:(state.pity[a.breed]||0)+1}
    else p=makeDes(a.breed);
  } else {const d=RECIPE[[a.breed,b.breed].sort().join('+')];p=d?makeDes(d):makeMutt(a,b)}
  p.stats=inheritStats(a,b,p.kind);
  /* Albino: 2% on any mix, 12% with one albino parent, 50% with two. Not stacked on rare coats. */
  const ac=[a,b].filter(x=>x.albino).length;
  if(p.kind!=='rare'&&Math.random()<(ac===2?.5:ac===1?.12:.02)){p.albino=true;p.traits.albino=true;p.label='Albino '+p.label}
  return p;
}
/* Rare coats: base chance rises 12 points per miss and is guaranteed on the 6th try for that breed. */
function pickCoat(a,b){const n=RARE[a.breed].length,par=[a,b].filter(x=>x.kind==='rare').map(x=>x.coat||0);
  if(par.length&&Math.random()<.6)return rnd(par);
  const un=[...Array(n).keys()].filter(i=>!state.dex['r:'+a.breed+':'+i]);
  return un.length&&Math.random()<.7?rnd(un):Math.floor(Math.random()*n)}
function rareChance(a,b){if(a.breed!==b.breed||!BASE[a.breed]||a.kind==='mutt'||b.kind==='mutt')return 0;
  const base=(a.kind==='rare'&&b.kind==='rare')?.6:(a.kind==='rare'||b.kind==='rare')?.4:.22,miss=(state.pity||{})[a.breed]||0;
  return miss>=5?1:Math.min(1,base+.12*miss)}
const busy=p=>p.trainUntil>0||!!p.show;
const isPure=p=>p.kind==='base'||p.kind==='rare';

/* ---------- Training ---------- */
const trainMs=p=>TRAIN_BASE*(1+Math.min(4,Math.floor((p.trainings||0)/2)));
const gainRange=v=>{const f=(100-v)/60;return[Math.max(1,Math.round(4*f)),Math.max(1,Math.round(9*f))]};
function finishTraining(p){
  const c=COURSES[p.trainCourse]||COURSES.agility,k=c.stat,[lo,hi]=gainRange(p.stats[k]);
  const g=lo+Math.floor(Math.random()*(hi-lo+1));p.stats[k]=Math.min(99,p.stats[k]+g);
  let msg=`${p.name} finished ${c.name.toLowerCase()}. ${SL[k]} +${g}`;
  if(Math.random()<.25){const o=rnd(['speed','smarts','heart'].filter(x=>x!==k)),b=1+Math.floor(Math.random()*2);p.stats[o]=Math.min(99,p.stats[o]+b);msg+=`, ${SL[o]} +${b}`}
  p.trainUntil=0;p.trainings=(p.trainings||0)+1;p.trainCourse=null;toast(msg+'.');bump('train');
}

/* ---------- Shows ---------- */
const eligible=(p,ev)=>!EVENTS[ev].pure||isPure(p);
function scoreOf(p,ev,handler,groom){const w=EVENTS[ev].w;let s=0;for(const k in w)s+=w[k]*p.stats[k];
  if(handler)s+=5;if(groom&&ev==='conf')s+=w.looks*10;return s}
const fieldOf=(ev,tier)=>TIERS[tier].field+(ev==='conf'?3:0);
function outlook(diff){return diff>=8?['Favorite','var(--good)']:diff>=0?['Contender','var(--select)']:diff>=-8?['Long shot','var(--new)']:['Outclassed','var(--muted)']}
function runShow(p,ev,tier,handler,groom){
  const tr=TIERS[tier],fld=fieldOf(ev,tier),est=scoreOf(p,ev,handler,groom),day=(Math.random()*2-1)*8,score=est+day;
  const comps=Array.from({length:7},()=>fld+gauss()*9);
  const place=1+comps.filter(c=>c>score).length,top=Math.max(score,...comps);
  const payout=place===1?tr.purse:place===2?Math.round(tr.purse*.5):place===3?Math.round(tr.purse*.3):place===4?Math.round(tr.purse*.15):Math.ceil(tr.fee*.4);
  const w=EVENTS[ev].w;let carry=null,cv=null;
  for(const k in w){const v=w[k]*(p.stats[k]-fld);if(cv===null||(place<=4?v>cv:v<cv)){cv=v;carry=k}}
  const pool=FLAIR[ev][place===1?'win':place<=4?'place':'back'];
  return {place,score:Math.round(score),top:Math.round(top),payout,carry,line:rnd(pool),day:Math.round(day),handler,groom:groom&&ev==='conf'};
}

/* ---------- Birthdays & gotcha days ---------- */
function isAnniv(p){if(!p.date)return false;const d=new Date(p.date),n=new Date();if(n.getFullYear()-d.getFullYear()<1)return false;
  let m=d.getMonth(),day=d.getDate();if(m===1&&day===29&&!leap(n.getFullYear()))day=28;return n.getMonth()===m&&n.getDate()===day}
const dayWord=p=>p.dateType==='gotcha'?'Gotcha day':'Birthday';
const md=ts=>new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'});
function ageStr(p){const days=Math.floor((Date.now()-p.date)/864e5),g=p.dateType==='gotcha';
  if(days<1)return g?'Adopted today':'Born today';
  if(days<60)return `${days} day${days>1?'s':''} ${g?'home':'old'}`;
  const mo=Math.floor(days/30.4);if(mo<24)return `${mo} months ${g?'home':'old'}`;
  return `${Math.floor(days/365.25)} years ${g?'home':'old'}`}
function party(){const d=today();if(state.lastParty===d)return;state.lastParty=d;const ps=state.pups.filter(isAnniv);if(!ps.length){save();return}
  state.treats=Math.min(state.treats+3*ps.length,CAP+10);save();
  toast(ps.length===1?`Happy ${dayWord(ps[0]).toLowerCase()}, ${ps[0].name}! +3 treats`:`${ps.length} pups are celebrating today! +${3*ps.length} treats`)}

/* ---------- Goals ---------- */
/* Three goals a day. Claiming on back-to-back days builds a streak worth +10% coins per day, up to +50%. */
const GOALS={
  mix:{t:n=>`Mix ${n} pups`,n:[2,3,4],coins:12},
  show:{t:n=>n>1?`Enter ${n} shows`:'Enter a show',n:[1,2],coins:14},
  ribbon:{t:()=>'Win a ribbon (top 4)',n:[1],coins:20},
  train:{t:n=>n>1?`Finish ${n} training sessions`:'Finish a training session',n:[1,2],coins:12},
  adopt:{t:()=>'Adopt a shelter pup',n:[1],coins:12},
  rehome:{t:()=>'Find a pup a furever home',n:[1],coins:8},
  fresh:{t:()=>'Add a new Pupdex entry',n:[1],coins:25},
};
const DEX_STEP=10, DEX_PRIZE=30, SORTS={age:'By age',stats:'Top stats',breed:'By breed'};
const dayStr=ts=>new Date(ts).toLocaleDateString('en-CA');
const streakPct=n=>Math.min(5,Math.max(0,n-1))*10;
function rollGoals(s){const d=today();if(s.goals&&s.goals.day===d)return false;
  let pool=Object.keys(GOALS);if(Object.keys(s.dex).length>=DEX.length)pool=pool.filter(k=>k!=='fresh');
  const list=[];while(list.length<3){const k=pool.splice(Math.floor(Math.random()*pool.length),1)[0],g=GOALS[k],n=rnd(g.n);list.push({k,n,p:0,claimed:false,coins:g.coins+(n-g.n[0])*6})}
  s.goals={day:d,list};return true}
function streakNow(){const st=state.streak||{n:0,day:''};return st.day===today()||st.day===dayStr(Date.now()-864e5)?st.n:0}
function claimStreak(){const st=state.streak||{n:0,day:''};return st.day===today()?st.n:st.day===dayStr(Date.now()-864e5)?st.n+1:1}
const dexReady=()=>Object.keys(state.dex).length>=((state.dexClaim||0)+1)*DEX_STEP;
const claimable=()=>state.goals.list.some(g=>!g.claimed&&g.p>=g.n)||dexReady();
function bump(k,n){const g=state.goals&&state.goals.list.find(g=>g.k===k&&!g.claimed);if(!g)return;const was=g.p>=g.n;g.p=clamp(g.p+(n||1),0,g.n);
  if(!was&&g.p>=g.n)toast(`Goal done: ${GOALS[k].t(g.n)}. Claim it in the Kennel.`)}
const sortMode=()=>SORTS[state.settings.sort]?state.settings.sort:'age';
function sortedPups(){const m=sortMode(),a=state.pups.slice();
  if(m==='stats')a.sort((x,y)=>avgStat(y)-avgStat(x));else if(m==='breed')a.sort((x,y)=>x.label.localeCompare(y.label)||x.id-y.id);return a}
function goalBar(){const L=state.goals.list,done=L.filter(g=>g.claimed).length,ready=L.filter(g=>!g.claimed&&g.p>=g.n).length+(dexReady()?1:0);
  const pips=L.map(g=>`<i class="${g.claimed?'done':g.p>=g.n?'ready':''}"></i>`).join('');
  return `<div class="kbar"><button class="goalbtn" data-act="goals"><span>Today’s goals<small>${ready?`${ready} ready to claim`:done===3?'All done. New ones tomorrow.':`${done} of 3 claimed`}</small></span><span class="pips">${pips}</span></button><button class="sortbtn" data-act="sort" aria-label="Change kennel sort order">Sort<b>${SORTS[sortMode()]}</b></button></div>`}
function showGoals(){
  const sn=streakNow(),pct=streakPct(claimStreak()),found=Object.keys(state.dex).length,nextAt=((state.dexClaim||0)+1)*DEX_STEP,have=Math.min(found,nextAt);
  const rows=state.goals.list.map((g,i)=>{const done=g.p>=g.n,c=Math.round(g.coins*(1+pct/100));
    return `<div class="goal"><div><b>${GOALS[g.k].t(g.n)}</b> <span class="cnt">${g.p} / ${g.n}</span></div>${g.claimed?`<button class="btn" disabled>Claimed</button>`:`<button class="btn ${done?'primary':''}" data-act="claim" data-i="${i}" ${done?'':'disabled'}><span class="cost">${I.coin}${c}</span></button>`}<div class="bar"><i style="width:${Math.round(g.p/g.n*100)}%"></i></div></div>`}).join('');
  const dex=nextAt>DEX.length?'':`<div class="lab">Pupdex milestone</div><div class="goal"><div><b>Find ${nextAt} Pupdex entries</b> <span class="cnt">${have} / ${nextAt}</span></div><button class="btn ${dexReady()?'primary':''}" data-act="claimDex" ${dexReady()?'':'disabled'}><span class="cost">${I.coin}${DEX_PRIZE}</span></button><div class="bar"><i style="width:${Math.round(have/nextAt*100)}%"></i></div></div>`;
  openSheet(`<h2>Today’s goals</h2><div class="sub">${sn?`Streak: day ${sn}`:'No streak yet'} · ${pct?`coin rewards +${pct}%`:'claim a goal every day to grow rewards'}</div>${rows}<p class="note" style="margin:0;text-align:center">Clear all three for 3 bonus treats. New goals arrive at midnight.</p>${dex}<button class="btn" data-act="close">Done</button>`,'Goals',true);
}
function mixHint(a,b){
  if(a.kind==='mutt'||b.kind==='mutt')return 'A mutt in the mix always makes a mutt. Stats pass down from both.';
  if(a.breed===b.breed){const rc=rareChance(a,b);return rc?`Rare coat chance: ${Math.round(rc*100)}%. It goes up with every miss.`:`Makes another ${nameOf(a.breed)}.`}
  const d=RECIPE[[a.breed,b.breed].sort().join('+')];
  return d?(state.dex['d:'+d]?`Makes a ${DES[d].name}.`:'Something about this pair feels promising.'):'No known cross here. You’ll get a one-of-a-kind mutt.'}

/* ---------- State ---------- */
function newGame(){const now=Date.now();const s={v:1,coins:25,treats:CAP,treatsAt:now,kennelCap:8,kennelBuys:0,yardCap:1,pups:[],dex:{},mutts:0,offers:[],offersAt:now,nextId:1,
  stats:{sessions:0,days:[],mixes:0,rehomes:0,ads:0,shows:0,purses:0,started:now}};
  ['lab','poodle','pug','beagle','corgi'].forEach(b=>addPup(s,makeBase(b),'gotcha'));rollOffers(s);migrate(s);return s}
function migrate(s){
  s.settings=s.settings||{askMutt:false}; s.hints=s.hints||{}; delete s.tip; s.owned=s.owned||{}; s.albinos=s.albinos||0;
  for(const k of Object.keys(s.dex)){const m=k.match(/^r:([a-z]+)$/);if(m){s.dex['r:'+m[1]+':0']=s.dex[k];delete s.dex[k]}}
  s.stats.shows=s.stats.shows||0; s.stats.purses=s.stats.purses||0;
  s.pups.forEach(p=>{
    if(!p.date){p.date=s.stats.started;p.dateType='gotcha'}if(p.kind==='rare'&&p.coat===undefined)p.coat=0;
    if(!p.stats){p.stats=p.kind==='mutt'?rollStats([45,45,45,50],15):rollStats(breedBase(p.breed),12);if(p.kind==='rare')p.stats.looks=Math.min(99,p.stats.looks+6)}
    if(p.stars){p.trainings=(p.trainings||0)+p.stars;for(let i=0;i<p.stars;i++){const k=rnd(['speed','smarts','heart']);p.stats[k]=Math.min(99,p.stats[k]+5)}delete p.stars}
    p.ribbons=p.ribbons||{};p.history=p.history||[];if(!p.case){p.case={};p.history.forEach(x=>{if(x.place<=4){const k=x.ev+'|'+x.tier+'|'+x.place;p.case[k]=(p.case[k]||0)+1}})}if(p.show===undefined)p.show=null;p.trainings=p.trainings||0;
  });
  (s.offers||[]).forEach(o=>{if(!o.pup.stats)o.pup.stats=o.pup.kind==='mutt'?rollStats([40,40,40,40],18):rollStats(BASE[o.pup.breed].s,12)});
  if(!s.tut){const a=s.pups.find(p=>p.breed==='lab'&&p.kind==='base'),b=s.pups.find(p=>p.breed==='poodle'&&p.kind==='base');
    s.tut=(s.stats.mixes===0&&a&&b)?{done:false,a:a.id,b:b.id}:{done:true}}
  rollGoals(s);
  return s}
/* Shelters are mostly mutts. About 1 in 4 arrivals is a purebred, leaning toward breeds you haven't found. */
function rollOffers(s){const keys=Object.keys(BASE);
  s.offers=[0,1,2].map(()=>{let p;if(Math.random()<.25){const un=keys.filter(k=>!s.dex['b:'+k]);p=makeBase(un.length&&Math.random()<.6?rnd(un):rnd(keys))}else p=shelterMutt();p.seed=Math.floor(Math.random()*1e9);p.id='o'+Math.random().toString(36).slice(2,8);return{pup:p,sold:false}})}
function load(){try{const r=localStorage.getItem(KEY);if(!r)return null;const s=JSON.parse(r);return s&&s.v===1?s:null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

const yardCost=()=>state.yardCap===1?60:140;
const training=()=>state.pups.filter(p=>p.trainUntil>0);
const offerCost=o=>o.pup.kind==='mutt'?SHELTER_MUTT_COST:SHELTER_COST;

function renderStatus(){

    (SFX[k]||[]).forEach(([f,at,d])=>{const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;
      g.gain.setValueAtTime(0,t0+at);g.gain.linearRampToValueAtTime(.09,t0+at+.015);g.gain.exponentialRampToValueAtTime(.001,t0+at+d);
      o.connect(g);g.connect(actx.destination);o.start(t0+at);o.stop(t0+at+d+.02)})}catch(e){}}
function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const c=document.createElement('div'),cols=['#D3EE45','#F2683A','#5357D4','#F4C842','#B44FCF','#2FAE77'];c.className='confetti';
  for(let i=0;i<36;i++){const p=document.createElement('i');p.style.cssText=`left:${Math.random()*100}%;background:${cols[i%cols.length]};animation-duration:${1.3+Math.random()*1.2}s;animation-delay:${Math.random()*.35}s`;c.appendChild(p)}
  document.body.appendChild(c);setTimeout(()=>c.remove(),3200)}

/* ---------- Actions ---------- */
function act(a,el){
  const now=Date.now();
  switch(a){
    case'tab':ui.tab=el.dataset.tab;ui.sel=[];render();window.scrollTo(0,0);placeCoach();break;
    case'sel':{const id=+el.dataset.id,i=ui.sel.indexOf(id);if(i>=0)ui.sel.splice(i,1);else{ui.sel.push(id);if(ui.sel.length>2)ui.sel.shift()}renderKennel();renderTray();placeCoach();break}
    case'mix':{const[a1,b1]=ui.sel.map(pupById);
      if(!a1||!b1||state.treats<MIX_COST||state.pups.length>=state.kennelCap||busy(a1)||busy(b1))return;
      if(state.treats>=CAP)state.treatsAt=now;state.treats-=MIX_COST;
      const p=mixResult(a1,b1),isNew=addPup(state,p,'birthday');state.stats.mixes++;state.tut.done=true;ui.sel=[];save();render();showResult(a1,b1,p,isNew);
      bump('mix');if(isNew)bump('fresh');save();setTimeout(()=>{sfx(isNew?'fresh':'mix');if(isNew)confetti()},850);break}
    case'rehome':{const p=pupById(ui.sel[0]);if(!p||busy(p)||state.pups.length<=2)return;rehome(p);break}
    case'rehomeNew':{const p=pupById(lastNew);closeSheet();if(p&&state.pups.length>2)rehome(p);else toast('Keep at least two pups so you can still mix.');break}
    case'profile':{const p=pupById(el.dataset.id);if(p){ui.ptab='profile';showProfile(p)}break}
    case'ptab':{const p=pupById(el.dataset.id);if(p){ui.ptab=el.dataset.v;showProfile(p)}break}
    case'train':{const p=pupById(ui.sel[0]);if(!p||busy(p)||training().length>=state.yardCap)return;showTrain(p);break}
    case'trainGo':{const p=pupById(ui.sel[0]);if(!p||busy(p)||training().length>=state.yardCap){closeSheet();return}
      p.trainCourse=el.dataset.c;p.trainUntil=now+trainMs(p);save();closeSheet();toast(`${p.name} started ${COURSES[p.trainCourse].name.toLowerCase()}.`);render();break}
    case'enter':{const p=pupById(ui.sel[0]);if(!p||busy(p))return;showEntry(p);break}
    case'eSet':{ui.entry[el.dataset.k]=el.dataset.v;if(ui.entry.ev!=='conf')ui.entry.groom=false;openSheet(entryHTML(),'Show entry',true);break}
    case'enterGo':{const e=ui.entry,p=e&&pupById(e.pid);if(!p||busy(p)||!eligible(p,e.ev))return;const tr=TIERS[e.tier],isConf=e.ev==='conf';
      const cost=tr.fee+(e.handler?tr.handler:0)+(e.groom&&isConf?tr.groom:0);if(state.coins<cost)return;
      state.coins-=cost;p.show={ev:e.ev,tier:e.tier,until:now+tr.ms,ready:false,res:runShow(p,e.ev,e.tier,e.handler,e.groom&&isConf)};state.stats.shows++;
      ui.sel=[];save();closeSheet();toast(`${p.name} is off to the ${tr.name.toLowerCase()} ${EVENTS[e.ev].name.toLowerCase()} show. Back in ${mins(tr.ms)}.`);bump('show');save();render();break}
    case'results':{const p=pupById(el.dataset.id);if(p&&p.show&&p.show.ready)showShowResult(p);break}
    case'collect':{const p=pupById(el.dataset.id);if(!p||!p.show||!p.show.ready)return;const r=p.show.res,ev=EVENTS[p.show.ev];
      state.coins+=r.payout;state.stats.purses+=r.payout;const k=Math.min(r.place,5);p.ribbons[k]=(p.ribbons[k]||0)+1;
      let exp='';if(Math.random()<.5){const main=Object.keys(ev.w).filter(x=>x!=='looks').sort((x,y)=>ev.w[y]-ev.w[x])[0];p.stats[main]=Math.min(99,p.stats[main]+1);exp=` Ring experience: ${SL[main]} +1.`}
      if(r.place<=4){p.case=p.case||{};const ck=p.show.ev+'|'+p.show.tier+'|'+r.place;p.case[ck]=(p.case[ck]||0)+1}
      p.history=p.history||[];p.history.unshift({t:now,ev:p.show.ev,tier:p.show.tier,place:r.place,score:r.score,payout:r.payout,line:r.line.replace(/\{n\}/g,p.name)});if(p.history.length>50)p.history.length=50;
      p.show=null;ui.sel=[];save();closeSheet();sfx('coin');toast(`+${r.payout} coins.${exp}`);if(r.place<=4)bump('ribbon');save();render();break}
    case'expand':{const c=expandCost();if(state.coins<c||state.kennelCap>=KENNEL_MAX)return;state.coins-=c;state.kennelCap+=2;state.kennelBuys++;save();toast(`Two new runs built. Room for ${state.kennelCap} pups.`);render();break}
    case'buy':{const o=state.offers[+el.dataset.i],c=o&&offerCost(o);if(!o||o.sold||state.coins<c||state.pups.length>=state.kennelCap)return;
      state.coins-=c;o.sold=true;const p=JSON.parse(JSON.stringify(o.pup));delete p.id;const nw=addPup(state,p,'gotcha');toast(`${p.name} the ${p.label} is home! Gotcha day: ${md(p.date)}.`);bump('adopt');if(nw)bump('fresh');save();render();break}
    case'refresh':{const free=now-state.offersAt>=OFFER_MS;if(!free){if(state.coins<REFRESH_COST)return;state.coins-=REFRESH_COST}else state.offersAt=now;rollOffers(state);save();render();break}
    case'yardup':{const c=yardCost();if(state.coins<c||state.yardCap>=YARD_MAX)return;state.coins-=c;state.yardCap++;save();render();break}
    case'dex':ui.dexSel=el.dataset.key;renderDex();placeCoach();window.scrollTo({top:0,behavior:'smooth'});break;
    case'ad':showAd();break;
    case'adCollect':state.treats=Math.min(state.treats+3,CAP+10);state.stats.ads++;save();closeSheet();toast('+3 treats');render();break;
    case'settings':showSettings();break;
    case'tipsAgain':state.hints={};save();closeSheet();toast('Tips will show again as you visit each tab.');break;
    case'tutskip':state.tut.done=true;save();placeCoach();break;
    case'hintok':state.hints[el.dataset.k]=true;save();placeCoach();break;
    case'reset':{if(now-resetArm<4000){try{localStorage.removeItem(KEY)}catch(e){}state=newGame();state.stats.sessions=1;state.stats.days=[today()];state.lastParty=today();svgCache.clear();ui={tab:'kennel',sel:[],dexSel:null,hats:false,entry:null};save();closeSheet();render();toast('Fresh kennel. Five pups are waiting.')}
      else{resetArm=now;el.textContent='Tap again to wipe everything'}break}
    case'buyItem':{const it=ITEM[el.dataset.id];if(!it||state.owned[it.id]||state.coins<it.price)return;state.coins-=it.price;state.owned[it.id]=true;save();toast(`${it.name} is yours. Dress a pup from its profile.`);render();break}
    case'wear':{const p=pupById(el.dataset.id);if(!p)return;p.wear=p.wear||{};p.wear[el.dataset.slot]=el.dataset.v||null;save();ui.ptab='wardrobe';showProfile(p);break}
    case'goals':showGoals();break;
    case'claim':{const g=state.goals.list[+el.dataset.i];if(!g||g.claimed||g.p<g.n)return;
      const n=claimStreak();state.streak={n,day:today()};
      const c=Math.round(g.coins*(1+streakPct(n)/100));g.claimed=true;state.coins+=c;let msg=`+${c} coins`;
      if(state.goals.list.every(x=>x.claimed)){state.treats=Math.min(state.treats+3,CAP+10);msg+=' and 3 bonus treats for clearing the board'}
      sfx('coin');save();showGoals();renderStatus();toast(msg+'.');break}
    case'claimDex':{if(!dexReady())return;state.dexClaim=(state.dexClaim||0)+1;state.coins+=DEX_PRIZE;sfx('coin');save();showGoals();renderStatus();
      toast(`+${DEX_PRIZE} coins for ${state.dexClaim*DEX_STEP} Pupdex entries.`);break}
    case'sort':{const ks=Object.keys(SORTS);state.settings.sort=ks[(ks.indexOf(sortMode())+1)%ks.length];save();renderKennel();placeCoach();break}
    case'undo':{const u=undoData;undoData=null;$('toast').hidden=true;if(!u)return;
      if(state.coins<u.v){toast('Those coins are already spent.');return}
      if(state.pups.length>=state.kennelCap){toast('No room left in the kennel.');return}
      state.coins-=u.v;state.pups.splice(Math.min(u.i,state.pups.length),0,u.p);state.stats.rehomes--;bump('rehome',-1);save();toast(`${u.p.name} is back home.`);render();break}
    case'saveCopy':{const code=btoa(unescape(encodeURIComponent(JSON.stringify(state)))),ta=$('saveCode');ta.value=code;ta.focus();ta.select();
      (navigator.clipboard?navigator.clipboard.writeText(code):Promise.reject()).then(()=>toast('Save code copied.'),()=>toast('The code is in the box. Copy it from there.'));break}
    case'saveLoad':{let s=null;try{s=JSON.parse(decodeURIComponent(escape(atob($('saveCode').value.replace(/\s+/g,'')))))}catch(e){}
      if(!s||s.v!==1||!Array.isArray(s.pups)||s.pups.length<2||!s.dex||!s.stats||!s.nextId){toast('That doesn’t look like a Mix-a-Pup save code.');return}
      if(now-loadArm>5000){loadArm=now;el.textContent='Tap again to replace this kennel';return}
      loadArm=0;state=migrate(s);svgCache.clear();ui={tab:'kennel',sel:[],dexSel:null,hats:false,entry:null};save();closeSheet();render();toast(`Kennel loaded. ${state.pups.length} pups are home.`);break}
    case'close':closeSheet();break;
  }
}
let undoData=null;
function rehome(p){const v=valueOf(p),i=state.pups.indexOf(p);state.coins+=v;state.pups.splice(i,1);ui.sel=[];state.stats.rehomes++;undoData={p,i,v};sfx('coin');
  toast(`${p.name} has found their furever home! +${v} coins`,true);bump('rehome');save();render()}
document.addEventListener('click',e=>{
  if(e.target.id==='overlay'){closeSheet();return}
  const el=e.target.closest('[data-act]');if(el&&!el.disabled)act(el.dataset.act,el);
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,p=pupById(f.dataset.id);
  if(p){const n=f.querySelector('#rnName'),b=f.querySelector('#rnBreed');
    if(n){const v=n.value.trim().slice(0,16);if(v)p.name=v}
    if(b){const v=b.value.trim().slice(0,24);if(v)p.label=v}
    save()}
  closeSheet();render();
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='setAsk'){state.settings.askMutt=e.target.checked;save()}
  if(id==='setHats'){ui.hats=e.target.checked;render()}
  if(id==='setSound'){state.settings.sound=e.target.checked;save();sfx('coin')}
  if((id==='eHandler'||id==='eGroom')&&ui.entry){ui.entry[id==='eHandler'?'handler':'groom']=e.target.checked;openSheet(entryHTML(),'Show entry',true)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('overlay').hidden)closeSheet()});

/* ---------- Clock ---------- */
function tick(){
  const now=Date.now();let changed=false;
  if(state.treats>=CAP)state.treatsAt=now;
  else{const g=Math.floor((now-state.treatsAt)/REGEN);if(g>0){state.treats=Math.min(CAP,state.treats+g);state.treatsAt+=g*REGEN;if(state.treats>=CAP)state.treatsAt=now;changed=true}}
  state.pups.forEach(p=>{
    if(p.trainUntil&&now>=p.trainUntil){finishTraining(p);changed=true}
    if(p.show&&!p.show.ready&&now>=p.show.until){p.show.ready=true;changed=true;toast(`${p.name} is back from the show. Results are in!`)}
  });
  if(state.lastParty!==today()){party();changed=true}
  if(rollGoals(state))changed=true;
  if(changed){save();if($('overlay').hidden)render();else{renderStatus();renderTabs()}}
  else{renderStatus();updateCountdowns()}
}

/* ---------- Boot ---------- */
let ticker;
function start(data){
  const fromHot=data&&data.state;
  state=migrate(fromHot?data.state:(load()||newGame()));
  if(!fromHot){state.stats.sessions++;const d=today();if(!state.stats.days.includes(d))state.stats.days.push(d);save()}
  render();tick();clearInterval(ticker);ticker=setInterval(tick,1000);
}
window.claude?.hot?.snapshot?.(()=>({state}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
<script>
if('serviceWorker' in navigator&&location.protocol==='https:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
